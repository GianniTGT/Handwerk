# Prodhimi në VPS (Infomaniak): app + PostgreSQL + Caddy (HTTPS automatik)
# Nisja:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: handwerk
      POSTGRES_PASSWORD: ${DB_PASSWORT}
      POSTGRES_DB: handwerk
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handwerk"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://handwerk:${DB_PASSWORT}@db:5432/handwerk
      COOKIE_SECURE: "1"
      APP_URL: ${APP_URL}
      TIFF_ADMIN_EMAILS: ${TIFF_ADMIN_EMAILS:-}
      REGISTRIERUNG: ${REGISTRIERUNG:-}
      TIFF_SUPPORT_EMAIL: ${TIFF_SUPPORT_EMAIL:-}
      TIFF_SUPPORT_TELEFON: ${TIFF_SUPPORT_TELEFON:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s # Migrationen laufen beim Start

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
