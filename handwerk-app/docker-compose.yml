# PostgreSQL lokal për zhvillim — niset me: docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: handwerk
      POSTGRES_PASSWORD: handwerk_dev
      POSTGRES_DB: handwerk
    ports:
      - "5432:5432"
    volumes:
      - handwerk_pgdata:/var/lib/postgresql/data

volumes:
  handwerk_pgdata:
